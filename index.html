<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pitchside Emergency Care has moved</title>
<meta name="description" content="Pitchside Emergency Care now lives at a new address.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1F3A">
<link rel="canonical" href="https://zaq6184-cell.github.io/PITCHSIDE-EMERGENCY-CARE-APP/">
<link rel="icon" type="image/svg+xml" href="https://zaq6184-cell.github.io/PITCHSIDE-EMERGENCY-CARE-APP/favicon.svg">
<noscript><meta http-equiv="refresh" content="0; url=https://zaq6184-cell.github.io/PITCHSIDE-EMERGENCY-CARE-APP/"></noscript>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    box-sizing: border-box;
    background: #0b1f3a;
    color: #f4f1ea;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 26rem; text-align: center; }
  h1 { margin: 0 0 0.5rem; font-size: 1.4rem; }
  p { margin: 0.5rem 0; color: #d4c9a8; }
  .note { display: none; }
  .standalone .note { display: block; }
  a.button {
    display: inline-block;
    margin-top: 1rem;
    padding: 0.8rem 1.4rem;
    border-radius: 0.75rem;
    background: #c9a227;
    color: #0b1f3a;
    font-weight: 700;
    text-decoration: none;
  }
  a.button:focus-visible { outline: 3px solid #f4f1ea; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Pitchside Emergency Care has moved</h1>
  <p>Taking you to the new address…</p>
  <p class="note">If you installed the app on this device, please install it again from the new address. The old icon will stop working.</p>
  <a class="button" id="go" href="https://zaq6184-cell.github.io/PITCHSIDE-EMERGENCY-CARE-APP/">Open Pitchside Emergency Care</a>
</main>
<script>
  // Every page of the old address goes to the same page at the new one (path, query and #section kept).
  (function () {
    var OLD = "/hkl-football-medicine-2026";
    var NEW = "https://zaq6184-cell.github.io/PITCHSIDE-EMERGENCY-CARE-APP";
    var path = location.pathname;
    var rest = path.indexOf(OLD) === 0 ? path.slice(OLD.length) : "/";
    var target = NEW + (rest || "/") + location.search + location.hash;
    document.getElementById("go").href = target;

    // an app installed from the old address: say so before moving on, so people know to reinstall
    var standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
    if (standalone) document.documentElement.className = "standalone";

    // retire the old app's offline copy, so it stops showing outdated pages
    var cleanup = Promise.resolve();
    if ("serviceWorker" in navigator) {
      cleanup = navigator.serviceWorker
        .getRegistrations()
        .then(function (regs) {
          return Promise.all(
            regs
              .filter(function (r) { return r.scope.indexOf(location.origin + OLD + "/") === 0; })
              .map(function (r) { return r.unregister(); })
          );
        })
        .catch(function () {});
    }
    var wait = new Promise(function (resolve) { setTimeout(resolve, 800); });
    Promise.race([cleanup, wait]).then(function () {
      if (standalone) setTimeout(function () { location.replace(target); }, 6000);
      else location.replace(target);
    });
  })();
</script>
</body>
</html>
